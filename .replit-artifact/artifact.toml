kind = "web"
previewPath = "/chainster/"
title = "Chainster"
version = "1.0.0"
id = "artifacts/chainster"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/chainster/" ]
localPort = 18782

[services.development]
run = "pnpm --filter @workspace/chainster run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chainster", "run", "build" ]
publicDir = "artifacts/chainster/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18782"
BASE_PATH = "/chainster/"
